<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fe_bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140727"/>
      <stop offset="0.5" stop-color="#210d3d"/>
      <stop offset="1" stop-color="#110522"/>
    </linearGradient>
    <linearGradient id="fe_accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fe_card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2e1053" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#190830" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="fe_shadow" x="0" y="0" width="1200" height="240" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#fe_bg)"/>
  <rect x="1" y="1" width="1198" height="238" rx="15" stroke="url(#fe_accent)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Decorative glow circles -->
  <circle cx="1100" cy="50" r="140" fill="#ec4899" fill-opacity="0.06"/>
  <circle cx="100" cy="190" r="110" fill="#8b5cf6" fill-opacity="0.06"/>
  <circle cx="620" cy="130" r="170" fill="#d946ef" fill-opacity="0.03"/>

  <!-- Title & Subtitle -->
  <g filter="url(#fe_shadow)">
    <text x="60" y="70" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">HIGH-FIDELITY WEB INTERFACES &amp; CLONES</text>
    <text x="60" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800">Frontend &amp; Web UI Engineering</text>
    <text x="60" y="145" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">React.js • Tailwind CSS • Responsive Layouts • State Machines • Pixel-Perfect Clones</text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(60, 168)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="165" height="34" rx="8" fill="url(#fe_card)" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="82.5" y="22" fill="#fdf2f8" text-anchor="middle">⛅ Real-Time Weather</text>

    <!-- Badge 2 -->
    <rect x="177" y="0" width="160" height="34" rx="8" fill="url(#fe_card)" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="257" y="22" fill="#fdf2f8" text-anchor="middle">🎵 Spotify UI Clone</text>

    <!-- Badge 3 -->
    <rect x="349" y="0" width="165" height="34" rx="8" fill="url(#fe_card)" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="431.5" y="22" fill="#fdf2f8" text-anchor="middle">🛍️ Daraz Storefront</text>

    <!-- Badge 4 -->
    <rect x="526" y="0" width="165" height="34" rx="8" fill="url(#fe_card)" stroke="#eab308" stroke-opacity="0.5"/>
    <text x="608.5" y="22" fill="#fdf2f8" text-anchor="middle">📦 Amazon Web Clone</text>

    <!-- Badge 5 -->
    <rect x="703" y="0" width="175" height="34" rx="8" fill="url(#fe_card)" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="790.5" y="22" fill="#fdf2f8" text-anchor="middle">📰 ProPakistani Portal</text>

    <!-- Badge 6 -->
    <rect x="890" y="0" width="160" height="34" rx="8" fill="url(#fe_card)" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="970" y="22" fill="#fdf2f8" text-anchor="middle">✨ Medely Landing</text>
  </g>
</svg>
