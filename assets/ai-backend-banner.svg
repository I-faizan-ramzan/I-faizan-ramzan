<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ai_bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05131e"/>
      <stop offset="0.5" stop-color="#092134"/>
      <stop offset="1" stop-color="#061826"/>
    </linearGradient>
    <linearGradient id="ai_accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ai_card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0f293d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#071b29" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="ai_shadow" x="0" y="0" width="1200" height="240" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#ai_bg)"/>
  <rect x="1" y="1" width="1198" height="238" rx="15" stroke="url(#ai_accent)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Decorative glow circles -->
  <circle cx="1120" cy="60" r="140" fill="#10b981" fill-opacity="0.05"/>
  <circle cx="120" cy="190" r="110" fill="#06b6d4" fill-opacity="0.05"/>
  <circle cx="650" cy="110" r="160" fill="#3b82f6" fill-opacity="0.03"/>

  <!-- Title & Subtitle -->
  <g filter="url(#ai_shadow)">
    <text x="60" y="70" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">INTELLIGENT AGENTS &amp; BACKEND ARCHITECTURE</text>
    <text x="60" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800">AI Systems &amp; Backend Engineering</text>
    <text x="60" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Autonomous AI Agents • Node.js • Express.js • MongoDB • Python Analytics • Cloudflare</text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(60, 168)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="165" height="34" rx="8" fill="url(#ai_card)" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="82.5" y="22" fill="#e2e8f0" text-anchor="middle">🤖 AgentMax Platform</text>

    <!-- Badge 2 -->
    <rect x="177" y="0" width="160" height="34" rx="8" fill="url(#ai_card)" stroke="#06b6d4" stroke-opacity="0.5"/>
    <text x="257" y="22" fill="#e2e8f0" text-anchor="middle">⚡ FastFly Logistics</text>

    <!-- Badge 3 -->
    <rect x="349" y="0" width="170" height="34" rx="8" fill="url(#ai_card)" stroke="#14b8a6" stroke-opacity="0.5"/>
    <text x="434" y="22" fill="#e2e8f0" text-anchor="middle">🌍 Impact Analyzer</text>

    <!-- Badge 4 -->
    <rect x="531" y="0" width="165" height="34" rx="8" fill="url(#ai_card)" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="613.5" y="22" fill="#e2e8f0" text-anchor="middle">🛡️ Node REST APIs</text>

    <!-- Badge 5 -->
    <rect x="708" y="0" width="160" height="34" rx="8" fill="url(#ai_card)" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="788" y="22" fill="#e2e8f0" text-anchor="middle">🍃 MongoDB Systems</text>

    <!-- Badge 6 -->
    <rect x="880" y="0" width="170" height="34" rx="8" fill="url(#ai_card)" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="965" y="22" fill="#e2e8f0" text-anchor="middle">☁️ Cloudflare Edge</text>
  </g>
</svg>
