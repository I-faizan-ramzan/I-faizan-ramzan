<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flagship_bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050d1a"/>
      <stop offset="0.5" stop-color="#0b172e"/>
      <stop offset="1" stop-color="#081024"/>
    </linearGradient>
    <linearGradient id="flagship_accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="flagship_card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#122442" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0b172e" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="flagship_shadow" x="0" y="0" width="1200" height="240" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#flagship_bg)"/>
  <rect x="1" y="1" width="1198" height="238" rx="15" stroke="url(#flagship_accent)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Decorative glow circles -->
  <circle cx="1100" cy="50" r="150" fill="#2563eb" fill-opacity="0.08"/>
  <circle cx="100" cy="190" r="120" fill="#10b981" fill-opacity="0.06"/>
  <circle cx="600" cy="110" r="180" fill="#38bdf8" fill-opacity="0.04"/>

  <!-- Title & Subtitle -->
  <g filter="url(#flagship_shadow)">
    <text x="60" y="68" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">DEVENTITY • ONGOING ENTERPRISE PRODUCTION PLATFORMS</text>
    <text x="60" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800">Flagship SaaS &amp; Logistics Systems</text>
    <text x="60" y="143" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Autonomous AI Agents • Next.js 16 • Cloudflare Workers • MongoDB Atlas • Dynamic Pricing • Proof of Delivery</text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(60, 168)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <!-- Badge 1: AgentMax -->
    <rect x="0" y="0" width="175" height="34" rx="8" fill="url(#flagship_card)" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="87.5" y="22" fill="#e2e8f0" text-anchor="middle">🤖 AgentMax.io</text>

    <!-- Badge 2: FastFly -->
    <rect x="187" y="0" width="165" height="34" rx="8" fill="url(#flagship_card)" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="269.5" y="22" fill="#e2e8f0" text-anchor="middle">🚚 FastFly.pk</text>

    <!-- Badge 3: Multi-Agent AI -->
    <rect x="364" y="0" width="165" height="34" rx="8" fill="url(#flagship_card)" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="446.5" y="22" fill="#e2e8f0" text-anchor="middle">⚡ Multi-Agent Engine</text>

    <!-- Badge 4: Dynamic Zone Matrix -->
    <rect x="541" y="0" width="180" height="34" rx="8" fill="url(#flagship_card)" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="631" y="22" fill="#e2e8f0" text-anchor="middle">📦 Logistics Lifecycle</text>

    <!-- Badge 5: Cloudflare Edge -->
    <rect x="733" y="0" width="165" height="34" rx="8" fill="url(#flagship_card)" stroke="#06b6d4" stroke-opacity="0.5"/>
    <text x="815.5" y="22" fill="#e2e8f0" text-anchor="middle">☁️ Cloudflare Edge</text>

    <!-- Badge 6: Full Architecture Specs -->
    <rect x="910" y="0" width="160" height="34" rx="8" fill="url(#flagship_card)" stroke="#ec4899" stroke-opacity="0.5"/>
    <text x="990" y="22" fill="#e2e8f0" text-anchor="middle">📑 1,300+ Lines Docs</text>
  </g>
</svg>
