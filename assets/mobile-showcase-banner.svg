<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mobile_bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090d16"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent_grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card_grad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="240" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#mobile_bg)"/>
  <rect x="1" y="1" width="1198" height="238" rx="15" stroke="url(#accent_grad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="50" r="140" fill="#38bdf8" fill-opacity="0.04"/>
  <circle cx="100" cy="200" r="100" fill="#6366f1" fill-opacity="0.05"/>
  <circle cx="600" cy="120" r="180" fill="#2563eb" fill-opacity="0.03"/>

  <!-- Title & Subtitle -->
  <g filter="url(#shadow)">
    <text x="60" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">NATIVE &amp; CROSS-PLATFORM</text>
    <text x="60" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800">Mobile Application Portfolio</text>
    <text x="60" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">React Native • Expo • Redux Toolkit • Context API • Native Device APIs • Tailwind CSS</text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(60, 168)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="150" height="34" rx="8" fill="url(#card_grad)" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="75" y="22" fill="#e2e8f0" text-anchor="middle">📈 TradeX Mobile</text>

    <!-- Badge 2 -->
    <rect x="162" y="0" width="165" height="34" rx="8" fill="url(#card_grad)" stroke="#60a5fa" stroke-opacity="0.4"/>
    <text x="244.5" y="22" fill="#e2e8f0" text-anchor="middle">💳 Expense Tracker</text>

    <!-- Badge 3 -->
    <rect x="339" y="0" width="135" height="34" rx="8" fill="url(#card_grad)" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="406.5" y="22" fill="#e2e8f0" text-anchor="middle">🍲 Meals App</text>

    <!-- Badge 4 -->
    <rect x="486" y="0" width="160" height="34" rx="8" fill="url(#card_grad)" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="566" y="22" fill="#e2e8f0" text-anchor="middle">📍 Places &amp; Maps</text>

    <!-- Badge 5 -->
    <rect x="658" y="0" width="165" height="34" rx="8" fill="url(#card_grad)" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="740.5" y="22" fill="#e2e8f0" text-anchor="middle">🔐 Mobile Auth Flow</text>

    <!-- Badge 6 -->
    <rect x="835" y="0" width="145" height="34" rx="8" fill="url(#card_grad)" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="907.5" y="22" fill="#e2e8f0" text-anchor="middle">🎮 Guess Game</text>
  </g>
</svg>
